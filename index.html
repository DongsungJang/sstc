0%,4%{transform:scale(0) rotate(-10deg);opacity:0}

// ─── 스코어 규칙 (스코어보드와 동일) ─────────────────────────────────────────
// 6점 선승. 5:5에서 끝나면 무승부, 가위바위보 승자를 고르면 그 팀 승.
const isTie = g => g.a === g.b && g.a >= 5;
function outcome(g) {

  if (isTie(g)) return g.rps === "a" || g.rps === "b" ? g.rps : "draw";

  if (g.b >= 6) return "b";
  return null;
}
const gameKey = (s, c) => `${s}_${c}`;
const sessionCourts = ses => ses.courts || [ses.c1, ses.c2]; // 예전 기록(코트 2면 고정)도 읽음

// 대진표의 모든 게임을 [{s,c,key,a:[이름,이름],b:[이름,이름],score,o}] 로 펼침
function flatGames(bracket, scores) {
  const out = [];
  if (!bracket) return out;
  bracket.sessions.forEach((ses, s) => sessionCourts(ses).forEach((ct, c) => {
    const key = gameKey(s, c),
      score = (scores || {})[key] || {
        a: 0,
        b: 0,
        rps: null
      };
    out.push({
      s,
      c,
      key,
      court: ct.no || c + 1,
      a: ct.a.map(i => bracket.players[i]),
      b: ct.b.map(i => bracket.players[i]),
      score,
      o: outcome(score)
    });
  }));
  return out;
}

// 개인 성적: 승·무·패, 득실
function standings(bracket, scores) {
  const t = {};
  if (!bracket) return [];
  bracket.players.forEach((n, i) => {
    t[n] = {
      name: n,
      rank: i + 1,
      w: 0,
      d: 0,
      l: 0,
      pf: 0,
      pa: 0,
      played: 0
    };
  });
  flatGames(bracket, scores).forEach(g => {
    if (!g.o) return;
    const add = (team, my, opp, res) => team.forEach(n => {
      const r = t[n];
      r.played++;
      r.pf += my;
      r.pa += opp;
      r[res]++;
    });
    if (g.o === "draw") {
      add(g.a, g.score.a, g.score.b, "d");
      add(g.b, g.score.b, g.score.a, "d");
    } else {
      add(g.a, g.score.a, g.score.b, g.o === "a" ? "w" : "l");
      add(g.b, g.score.b, g.score.a, g.o === "b" ? "w" : "l");
    }
  });
  return Object.values(t).sort((x, y) => y.w - x.w || y.pf - y.pa - (x.pf - x.pa) || x.l - y.l || x.rank - y.rank);
}

const FIREBASE_ROOT = "club"; // 스코어보드(results)와 섞이지 않게 club/ 아래에 저장

function flatPaths(obj, prefix, out) {

function firebaseDb() {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
  const root = window.firebase.database().ref(FIREBASE_ROOT);
  return {
    shared: true,
    doc: path => {
      const ref = root.child(path);
      return {
        onSnapshot: (next, error) => {
          const h = snap => next({
            exists: snap.exists(),
            data: () => snap.val()

          ref.on("value", h, error);
          return () => ref.off("value", h);
        },
        set: v => ref.set(v == null ? null : JSON.parse(JSON.stringify(v))),
        update: v => ref.update(flatPaths(JSON.parse(JSON.stringify(v)), "", {})),
        delete: () => ref.remove()

const LOCAL_KEY = "sstc-club-local-v2";
function localDb() {
  let tree;
  try {
    tree = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
  } catch (e) {
    tree = {};
  }
  const subs = new Set();
  const get = path => path.split("/").reduce((o, k) => o == null ? undefined : o[k], tree);
  const put = (path, v) => {
    const ks = path.split("/");
    let o = tree;
    ks.slice(0, -1).forEach(k => {
      if (!o[k] || typeof o[k] !== "object") o[k] = {};
      o = o[k];
    });
    if (v == null) delete o[ks[ks.length - 1]];else o[ks[ks.length - 1]] = JSON.parse(JSON.stringify(v));
  };
  const commit = () => {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(tree));
    } catch (e) {}
    subs.forEach(f => f());
    return Promise.resolve();
  };
  return {
    shared: false,
    doc: path => ({
      onSnapshot: next => {
        const f = () => {
          const v = get(path);
          next({
            exists: v !== undefined,
            data: () => v === undefined ? null : JSON.parse(JSON.stringify(v))
          });
        };
        subs.add(f);
        setTimeout(f, 0);
        return () => subs.delete(f);
      },
      set: v => {
        put(path, v);
        return commit();
      },
      update: v => {
        const f = flatPaths(v, "", {});
        Object.keys(f).forEach(k => put(path + "/" + k, f[k]));
        return commit();
      },
      delete: () => {
        put(path, null);
        return commit();
      }
    })
  };
}
